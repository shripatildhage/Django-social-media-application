{% extends "base.html" %}
{% block title %}Notifications{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-7">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h4>&#128276; Notifications</h4>
    <form method="post" action="{% url 'notifications_read_all' %}">{% csrf_token %}<button class="btn btn-sm btn-outline-secondary">Mark all read</button></form>
  </div>
  <div id="notif-list" class="list-group">
  {% for n in notifications %}
    <a class="list-group-item list-group-item-action {% if not n.is_read %}fw-bold{% endif %}" href="{% url 'notification_open' n.id %}">
      {{ n.text }} <span class="small text-secondary">&middot; {{ n.created_at|timesince }} ago</span></a>
  {% empty %}<div class="text-secondary">You're all caught up.</div>{% endfor %}
  </div>
</div></div>
{% endblock %}
