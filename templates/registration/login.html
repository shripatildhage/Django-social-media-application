{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
  <h3>Log in</h3>
  <form method="post">{% csrf_token %}{{ form.as_p }}<input type="hidden" name="next" value="{{ next }}"><button class="btn btn-primary">Login</button></form>
  <p class="mt-3">No account? <a href="{% url 'register' %}">Sign up</a></p>
</div></div>
{% endblock %}
