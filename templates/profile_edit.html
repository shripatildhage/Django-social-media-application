{% extends "base.html" %}
{% block title %}Edit profile{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-7">
  <h3>Edit profile</h3>
  <form method="post" enctype="multipart/form-data">{% csrf_token %}
    {{ u_form.as_p }}{{ p_form.as_p }}
    <button class="btn btn-primary">Save</button> <a class="btn btn-outline-secondary" href="{% url 'profile' user.username %}">Cancel</a>
  </form>
</div></div>
{% endblock %}
